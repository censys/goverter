input:
    input.go: |
        package execution

        // goverter:converter
        type Converter interface {
            // goverter:struct:assign method
            // goverter:struct:assign:source Get(.*)
            // goverter:struct:assign:presence
            Convert(source Input) Output
        }

        type Input struct{ email string }

        func (i Input) GetEmail() string { return i.email }
        func (i Input) HasEmail() bool   { return i.email != "" }

        type Output struct{ email string }

        func (o *Output) SetEmail(email string) { o.email = email }
success:
    - generated/generated.go: |
        // Code generated by github.com/jmattheis/goverter, DO NOT EDIT.

        package generated

        import execution "github.com/jmattheis/goverter/execution"

        type ConverterImpl struct{}

        func (c *ConverterImpl) Convert(source execution.Input) execution.Output {
        	var executionOutput execution.Output
        	if source.HasEmail() {
        		executionOutput.SetEmail(source.GetEmail())
        	}
        	return executionOutput
        }
