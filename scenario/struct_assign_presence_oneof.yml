        type Input struct {
            Email string
            Phone string
        }

        func (i Input) HasEmail() bool { return i.Email != "" }
        func (i Input) HasPhone() bool { return i.Phone != "" }

        type Output struct {
            email string
            phone string
        }

        func (o *Output) SetEmail(v string) { o.email = v }
        func (o *Output) SetPhone(v string) { o.phone = v }
